<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EducaTi: calcule a sua pegada de carbono e descubra como reduzir, com conteúdos curtos sobre clima e consumo.">
  <meta name="theme-color" content="#16a34a">
  <title>EducaTi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script>
    // Escolhe o tema antes de desenhar a página, para não piscar claro → escuro.
    // Usa a escolha salva; se não houver, segue o tema do sistema.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('educati_theme'); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app" data-skip-link>Pular para o conteúdo</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="#/" aria-label="EducaTi, página inicial">
        <span class="logo__mark" aria-hidden="true">E</span>
        <span class="logo__text">Educa<span>Ti</span></span>
      </a>
      <div class="site-header__end">
        <nav class="nav" aria-label="Principal">
          <a class="nav__link" href="#/" data-nav="home">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>Início</span>
          </a>
          <a class="nav__link" href="#/calculadora" data-nav="calc">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></svg>
            <span>Calculadora</span>
          </a>
          <a class="nav__link" href="#/aprender" data-nav="learn">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h13v-4"/></svg>
            <span>Aprender</span>
          </a>
        </nav>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Modo noturno">
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr-only">Modo noturno</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© 2026 EducaTi</span>
      <span>Estimativas simplificadas, para fins informativos.</span>
    </div>
  </footer>
</body>
</html>
